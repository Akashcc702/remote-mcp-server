services:
  - type: web
    name: claude-antigravity-remote-mcp
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: MCP_TOKEN
        generateValue: false
        value: c9c7230c9f593c89d8847bbdc4fecea1
